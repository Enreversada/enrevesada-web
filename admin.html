<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración | Enrevesada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f8f9fa;
      color: #2b2b2b;
      padding: 30px 15px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 760px;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    h1 { font-size: 1.6rem; margin-bottom: 20px; color: #111; }
    h2 { font-size: 1.2rem; margin: 35px 0 15px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
    
    .form-group { margin-bottom: 18px; }
    label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; }
    input[type="text"], textarea, input[type="password"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus { border-color: #333; }
    textarea { min-height: 200px; resize: vertical; line-height: 1.5; }
    
    button.btn-primary {
      background: #111;
      color: #fff;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button.btn-primary:hover { background: #333; }
    
    .status-msg {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }
    .status-msg.success { background: #e6f7ec; color: #0d6832; }
    .status-msg.error { background: #fde8e8; color: #9b1c1c; }

    /* Pestañas de moderación */
    .tabs-nav {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    .tab-btn {
      padding: 8px 16px;
      border: 1px solid #ddd;
      background: #f8f9fa;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: #111;
      color: #fff;
      border-color: #111;
    }

    /* Tarjetas de Comentarios */
    .comment-card {
      background: #fdfdfd;
      border: 1px solid #eaeaea;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }
    .comment-info strong { display: block; font-size: 0.95rem; color: #111; }
    .comment-info p { font-size: 0.85rem; color: #555; margin-top: 4px; }
    .comment-info small { color: #888; font-size: 0.75rem; }
    
    .comment-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .btn-approve { background: #2e7d32; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
    .btn-hide { background: #f57c00; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
    .btn-delete { background: #d32f2f; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }

    /* Modal PIN */
    #lock-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #ffffff; display: flex; align-items: center; justify-content: center;
      z-index: 999;
    }
    .pin-box { text-align: center; max-width: 300px; width: 100%; padding: 20px; }
  </style>
</head>
<body>

  <!-- Bloqueo por PIN de seguridad -->
  <div id="lock-screen">
    <div class="pin-box">
      <h2>Acceso Escritora</h2>
      <input type="password" id="pin-input" placeholder="Introduce la clave" style="text-align: center; margin-bottom: 12px;">
      <button class="btn-primary" style="width: 100%;" onclick="verificarPin()">Entrar</button>
      <p id="pin-error" style="color: red; font-size: 0.85rem; margin-top: 10px; display: none;">Clave incorrecta</p>
    </div>
  </div>

  <div class="container" id="admin-panel" style="display: none;">
    <h1>Panel de Gestión</h1>

    <!-- Formulario para publicar nuevo escrito -->
    <form id="post-form">
      <h2>Publicar nuevo escrito</h2>
      
      <div class="form-group">
        <label for="titulo">Título</label>
        <input type="text" id="titulo" placeholder="Ej: Las noches en calma" required>
      </div>

      <div class="form-group">
        <label for="fecha">Fecha</label>
        <input type="text" id="fecha" placeholder="Ej: 11 de agosto, 2026" required>
      </div>

      <div class="form-group">
        <label for="resumen">Resumen / Extracto</label>
        <input type="text" id="resumen" placeholder="Breve frase para la vista previa..." required>
      </div>

      <div class="form-group">
        <label for="contenido">Contenido completo</label>
        <textarea id="contenido" placeholder="Escribe el texto aquí. Los saltos de línea se respetarán en la web..." required></textarea>
      </div>

      <button type="submit" class="btn-primary">Publicar escrito</button>
      <div id="status" class="status-msg"></div>
    </form>

    <!-- Sección de gestión de comentarios -->
    <h2>Gestión de comentarios</h2>
    <div class="tabs-nav">
      <button class="tab-btn active" id="tab-pending" onclick="cambiarPestaña(false)">Pendientes</button>
      <button class="tab-btn" id="tab-approved" onclick="cambiarPestaña(true)">Publicados (Aprobados)</button>
    </div>

    <div id="comments-container">Cargando comentarios...</div>
  </div>

  <script>
    const SUPABASE_URL = 'https://fkmkoryqvyobiwlixstx.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_A55H3d-UeWQCgIP6MYgrBw_25qhZneL';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const CLAVE_SECRETA = '1234';
    let estadoFiltroActual = false; // false = pendientes, true = aprobados

    function verificarPin() {
      const pin = document.getElementById('pin-input').value;
      if (pin === CLAVE_SECRETA) {
        document.getElementById('lock-screen').style.display = 'none';
        document.getElementById('admin-panel').style.display = 'block';
        cargarComentarios(estadoFiltroActual);
      } else {
        document.getElementById('pin-error').style.display = 'block';
      }
    }

    // Fecha actual predeterminada
    const hoy = new Date();
    const opcionesFecha = { day: 'numeric', month: 'long', year: 'numeric' };
    document.getElementById('fecha').value = hoy.toLocaleDateString('es-ES', opcionesFecha);

    // 1. Publicar nuevo escrito
    document.getElementById('post-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const status = document.getElementById('status');
      status.style.display = 'none';

      const titulo = document.getElementById('titulo').value.trim();
      const fecha = document.getElementById('fecha').value.trim();
      const resumen = document.getElementById('resumen').value.trim();
      const contenido = document.getElementById('contenido').value.trim();

      const { error } = await _supabase.from('escritos').insert([
        { titulo, fecha, resumen, contenido, likes: 0 }
      ]);

      if (error) {
        status.textContent = 'Error al publicar: ' + error.message;
        status.className = 'status-msg error';
        status.style.display = 'block';
      } else {
        status.textContent = '¡Escrito publicado con éxito en la web!';
        status.className = 'status-msg success';
        status.style.display = 'block';
        document.getElementById('post-form').reset();
        document.getElementById('fecha').value = hoy.toLocaleDateString('es-ES', opcionesFecha);
      }
    });

    // 2. Navegación entre pestañas de comentarios
    function cambiarPestaña(esAprobado) {
      estadoFiltroActual = esAprobado;
      document.getElementById('tab-pending').classList.toggle('active', !esAprobado);
      document.getElementById('tab-approved').classList.toggle('active', esAprobado);
      cargarComentarios(esAprobado);
    }

    // 3. Cargar comentarios según estado
    async function cargarComentarios(esAprobado) {
      const container = document.getElementById('comments-container');
      container.innerHTML = '<p style="color:#777; font-size:0.9rem;">Cargando comentarios...</p>';

      const { data: comments, error } = await _supabase
        .from('comentarios')
        .select('*')
        .eq('aprobado', esAprobado)
        .order('id', { ascending: false });

      if (error || !comments || comments.length === 0) {
        container.innerHTML = `<p style="color:#777; font-size:0.9rem;">No hay comentarios en esta sección.</p>`;
        return;
      }

      container.innerHTML = comments.map(c => `
        <div class="comment-card" id="comm-${c.id}">
          <div class="comment-info">
            <strong>${c.nombre}</strong>
            <p>${c.texto}</p>
            <small>Escrito ID: ${c.escrito_id}</small>
          </div>
          <div class="comment-actions">
            ${
              !esAprobado 
                ? `<button class="btn-approve" onclick="cambiarEstadoComentario(${c.id}, true)">Aprobar</button>` 
                : `<button class="btn-hide" onclick="cambiarEstadoComentario(${c.id}, false)">Ocultar</button>`
            }
            <button class="btn-delete" onclick="eliminarComentario(${c.id})">Borrar</button>
          </div>
        </div>
      `).join('');
    }

    // 4. Cambiar estado (Aprobar u Ocultar)
    async function cambiarEstadoComentario(id, nuevoEstado) {
      const { error } = await _supabase
        .from('comentarios')
        .update({ aprobado: nuevoEstado })
        .eq('id', id);

      if (!error) {
        cargarComentarios(estadoFiltroActual);
      }
    }

    // 5. Eliminar comentario
    async function eliminarComentario(id) {
      if (!confirm('¿Seguro que deseas eliminar este comentario?')) return;
      const { error } = await _supabase
        .from('comentarios')
        .delete()
        .eq('id', id);

      if (!error) {
        cargarComentarios(estadoFiltroActual);
      }
    }
  </script>
</body>
</html>
