<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración | Enrevesada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f8f9fa;
      color: #2b2b2b;
      padding: 30px 15px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 820px;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }
    h1 { font-size: 1.5rem; color: #111; }
    h2 { font-size: 1.2rem; margin: 30px 0 15px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
    
    .form-group { margin-bottom: 18px; }
    label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; }
    input[type="text"], input[type="email"], input[type="password"], textarea, input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
    }
    textarea { min-height: 180px; resize: vertical; line-height: 1.5; }
    
    button.btn-primary {
      background: #111;
      color: #fff;
      border: none;
      padding: 12px 24px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }
    button.btn-primary:disabled { background: #888; cursor: not-allowed; }
    button.btn-logout {
      background: #eee;
      color: #333;
      border: none;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }
    
    .status-msg {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }
    .status-msg.success { background: #e6f7ec; color: #0d6832; }
    .status-msg.error { background: #fde8e8; color: #9b1c1c; }

    .tabs-nav { display: flex; gap: 10px; margin-bottom: 15px; }
    .tab-btn {
      padding: 8px 16px;
      border: 1px solid #ddd;
      background: #f8f9fa;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
    }
    .tab-btn.active { background: #111; color: #fff; border-color: #111; }

    /* Estilos para la tabla de métricas de escritos */
    .stats-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    .stats-table th, .stats-table td {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid #eee;
      font-size: 0.9rem;
    }
    .stats-table th { background: #f8f9fa; font-weight: 600; color: #444; }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.8rem;
    }
    .badge-views { background: #e3f2fd; color: #0d47a1; }
    .badge-likes { background: #fbe9e7; color: #c62828; }

    .comment-card {
      background: #fdfdfd;
      border: 1px solid #eaeaea;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }
    .comment-info strong { display: block; font-size: 0.95rem; color: #111; }
    .comment-info p { font-size: 0.85rem; color: #555; margin-top: 4px; }
    .comment-info small { color: #888; font-size: 0.75rem; }
    .comment-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .btn-approve { background: #2e7d32; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    .btn-hide { background: #f57c00; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    .btn-delete { background: #d32f2f; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }

    #login-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #f8f9fa; display: flex; align-items: center; justify-content: center;
      z-index: 999;
    }
    .login-box {
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
  </style>
</head>
<body>

  <!-- Login -->
  <div id="login-screen">
    <div class="login-box">
      <h2 style="margin-top:0; margin-bottom:15px; text-align:center;">Iniciar Sesión</h2>
      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Correo electrónico</label>
          <input type="email" id="login-email" required placeholder="tucorreo@ejemplo.com">
        </div>
        <div class="form-group">
          <label for="login-password">Contraseña</label>
          <input type="password" id="login-password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn-primary" style="width: 100%;">Entrar al panel</button>
        <p id="login-error" style="color: #d32f2f; font-size: 0.85rem; margin-top: 10px; display: none; text-align: center;"></p>
      </form>
    </div>
  </div>

  <!-- Panel -->
  <div class="container" id="admin-panel" style="display: none;">
    <div class="header-bar">
      <h1>Panel de Escritora</h1>
      <button class="btn-logout" onclick="cerrarSesion()">Cerrar sesión</button>
    </div>

    <!-- Formulario para publicar -->
    <form id="post-form">
      <h2>Publicar nuevo escrito</h2>
      
      <div class="form-group">
        <label for="titulo">Título</label>
        <input type="text" id="titulo" placeholder="Ej: Las noches en calma" required>
      </div>

      <div class="form-group">
        <label for="fecha">Fecha</label>
        <input type="text" id="fecha" required>
      </div>

      <div class="form-group">
        <label for="resumen">Resumen / Extracto</label>
        <input type="text" id="resumen" placeholder="Breve frase para la vista previa..." required>
      </div>

      <div class="form-group">
        <label for="imagen">Imagen (Opcional)</label>
        <input type="file" id="imagen" accept="image/*">
      </div>

      <div class="form-group">
        <label for="contenido">Contenido completo</label>
        <textarea id="contenido" placeholder="Escribe aquí el texto..." required></textarea>
      </div>

      <button type="submit" id="btn-submit" class="btn-primary">Publicar escrito</button>
      <div id="status" class="status-msg"></div>
    </form>

    <!-- Métricas de Impacto (Vistas y Likes) -->
    <h2>Métricas e impacto de mis escritos</h2>
    <div id="posts-stats-container">Cargando métricas...</div>

    <!-- Gestión de comentarios -->
    <h2>Gestión de comentarios</h2>
    <div class="tabs-nav">
      <button class="tab-btn active" id="tab-pending" onclick="cambiarPestaña(false)">Pendientes</button>
      <button class="tab-btn" id="tab-approved" onclick="cambiarPestaña(true)">Publicados (Aprobados)</button>
    </div>

    <div id="comments-container">Cargando comentarios...</div>
  </div>

  <script>
    const SUPABASE_URL = 'https://fkmkoryqvyobiwlixstx.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_A55H3d-UeWQCgIP6MYgrBw_25qhZneL';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let estadoFiltroActual = false;

    async function chequearSesion() {
      const { data: { session } } = await _supabase.auth.getSession();
      if (session) {
        mostrarPanel();
      } else {
        document.getElementById('login-screen').style.display = 'flex';
        document.getElementById('admin-panel').style.display = 'none';
      }
    }

    function mostrarPanel() {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('admin-panel').style.display = 'block';
      
      const hoy = new Date();
      document.getElementById('fecha').value = hoy.toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' });
      cargarMetricasEscritos();
      cargarComentarios(estadoFiltroActual);
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const errorMsg = document.getElementById('login-error');
      errorMsg.style.display = 'none';

      const { error } = await _supabase.auth.signInWithPassword({ email, password });
      if (error) {
        errorMsg.textContent = 'Credenciales incorrectas: ' + error.message;
        errorMsg.style.display = 'block';
      } else {
        mostrarPanel();
      }
    });

    async function cerrarSesion() {
      await _supabase.auth.signOut();
      window.location.reload();
    }

    // Cargar estadísticas de vistas y likes
    async function cargarMetricasEscritos() {
      const container = document.getElementById('posts-stats-container');
      const { data: posts, error } = await _supabase
        .from('escritos')
        .select('id, titulo, fecha, likes, vistas')
        .order('id', { ascending: false });

      if (error || !posts || posts.length === 0) {
        container.innerHTML = '<p style="color:#777; font-size:0.9rem;">Aún no hay publicaciones creadas.</p>';
        return;
      }

      container.innerHTML = `
        <table class="stats-table">
          <thead>
            <tr>
              <th>Título</th>
              <th>Fecha</th>
              <th>Lecturas</th>
              <th>Likes</th>
            </tr>
          </thead>
          <tbody>
            ${posts.map(p => `
              <tr>
                <td><strong>${p.titulo || 'Sin título'}</strong></td>
                <td style="color:#666;">${p.fecha || ''}</td>
                <td><span class="badge badge-views">👁️ ${p.vistas || 0} lecturas</span></td>
                <td><span class="badge badge-likes">❤️ ${p.likes || 0} likes</span></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    // Publicar escrito
    document.getElementById('post-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btnSubmit = document.getElementById('btn-submit');
      const status = document.getElementById('status');
      
      status.style.display = 'none';
      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Subiendo y publicando...';

      const titulo = document.getElementById('titulo').value.trim();
      const fecha = document.getElementById('fecha').value.trim();
      const resumen = document.getElementById('resumen').value.trim();
      let contenido = document.getElementById('contenido').value.trim();
      const fileInput = document.getElementById('imagen');

      try {
        if (fileInput.files.length > 0) {
          const file = fileInput.files[0];
          const fileExt = file.name.split('.').pop();
          const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 8)}.${fileExt}`;

          const { error: uploadError } = await _supabase.storage.from('imagenes').upload(fileName, file);
          if (uploadError) throw new Error('Error al subir la imagen: ' + uploadError.message);

          const { data: urlData } = _supabase.storage.from('imagenes').getPublicUrl(fileName);
          contenido = `${urlData.publicUrl}\n\n${contenido}`;
        }

        const { error: insertError } = await _supabase.from('escritos').insert([
          { titulo, fecha, resumen, contenido, likes: 0, vistas: 0 }
        ]);

        if (insertError) throw new Error('Error al guardar el escrito: ' + insertError.message);

        status.textContent = '¡Escrito publicado con éxito en la web!';
        status.className = 'status-msg success';
        status.style.display = 'block';
        document.getElementById('post-form').reset();
        cargarMetricasEscritos();

      } catch (err) {
        status.textContent = err.message;
        status.className = 'status-msg error';
        status.style.display = 'block';
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.textContent = 'Publicar escrito';
      }
    });

    function cambiarPestaña(esAprobado) {
      estadoFiltroActual = esAprobado;
      document.getElementById('tab-pending').classList.toggle('active', !esAprobado);
      document.getElementById('tab-approved').classList.toggle('active', esAprobado);
      cargarComentarios(esAprobado);
    }

    async function cargarComentarios(esAprobado) {
      const container = document.getElementById('comments-container');
      container.innerHTML = '<p style="color:#777; font-size:0.9rem;">Cargando comentarios...</p>';

      const { data: comments, error } = await _supabase
        .from('comentarios')
        .select('*')
        .eq('aprobado', esAprobado)
        .order('id', { ascending: false });

      if (error || !comments || comments.length === 0) {
        container.innerHTML = `<p style="color:#777; font-size:0.9rem;">No hay comentarios en esta sección.</p>`;
        return;
      }

      container.innerHTML = comments.map(c => `
        <div class="comment-card" id="comm-${c.id}">
          <div class="comment-info">
            <strong>${c.nombre}</strong>
            <p>${c.texto}</p>
            <small>Escrito ID: ${c.escrito_id}</small>
          </div>
          <div class="comment-actions">
            ${
              !esAprobado 
                ? `<button class="btn-approve" onclick="cambiarEstadoComentario(${c.id}, true)">Aprobar</button>` 
                : `<button class="btn-hide" onclick="cambiarEstadoComentario(${c.id}, false)">Ocultar</button>`
            }
            <button class="btn-delete" onclick="eliminarComentario(${c.id})">Borrar</button>
          </div>
        </div>
      `).join('');
    }

    async function cambiarEstadoComentario(id, nuevoEstado) {
      const { error } = await _supabase.from('comentarios').update({ aprobado: nuevoEstado }).eq('id', id);
      if (!error) cargarComentarios(estadoFiltroActual);
    }

    async function eliminarComentario(id) {
      if (!confirm('¿Seguro que deseas eliminar este comentario?')) return;
      const { error } = await _supabase.from('comentarios').delete().eq('id', id);
      if (!error) cargarComentarios(estadoFiltroActual);
    }

    chequearSesion();
  </script>
</body>
</html>
