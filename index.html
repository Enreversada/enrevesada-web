<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enreve®sada</title>
  
  <!-- Estilos (asegúrate de que el nombre coincida con tu archivo CSS en GitHub) -->
  <link rel="stylesheet" href="style.css">
  
  <!-- Fuentes de Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500;700&family=Playball&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  
  <!-- Conector Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <main class="container">

    <!-- Cabecera de Portada -->
    <header class="book-header">
      <div class="portada-wrapper">
        <p id="pre-title" class="pre-title">"De todas las constelaciones elijo su luz"</p>

        <!-- Bloque de título + subtítulo + imagen circular -->
        <div class="brand-header">
          <img id="profile-avatar" src="autor.jpeg" alt="Foto de Enrevesada" class="profile-avatar">
          <div class="brand-title">
            <h1 id="accent-title" class="accent-title">Enreve®sada</h1>
            <p id="sub-title" class="sub-title">Escribo y se me pasa</p>
          </div>
        </div>

        <!-- Elemento decorativo: el pequeño corazón -->
        <span class="decorator">&#10084;</span>
      </div>

      <!-- Captura de suscriptores -->
      <form class="newsletter-form" id="newsletterForm"
        action="https://e39fbd44.sibforms.com/serve/MUIFAKcdCuXxQUpQs9S6d7dZFlfQ8uOSFkO5sOyLy-tfhyDM6UwBA8cQulz_EzkvEJDxNgLiaVmXgC-fjJzD6ffBXzBEDBatxvGtnHlG2vNHnbMKJnUR5YDLIoGv207Dz6o2s7CiRRykT8y25LaezKX9RkJ1JHfCrDufL1JXLmCwMO55fFG__9xne-XIhgudEHtBaBf6f2v2RQ7c9Q=="
        method="POST">
        <input type="email" id="newsletterEmail" name="EMAIL"
          placeholder="Recibe mis publicaciones en tu correo..." required autocomplete="email">
        <button type="submit">Suscribirse</button>
      </form>
      <p id="newsletterMessage" style="display:none; color: #8c4a4a; margin-top: 10px; font-size: 0.9em; font-weight: 500;"></p>

      <script>
        document.getElementById('newsletterForm').addEventListener('submit', function (e) {
          e.preventDefault();
          const form = this;
          const emailInput = document.getElementById('newsletterEmail');
          const messageEl = document.getElementById('newsletterMessage');

          fetch(form.action, {
            method: 'POST',
            body: new FormData(form),
            mode: 'no-cors'
          })
            .then(() => {
              messageEl.textContent = '¡Gracias por suscribirte!';
              messageEl.style.display = 'block';
              emailInput.value = '';
            })
            .catch(() => {
              messageEl.textContent = '¡Gracias por suscribirte!';
              messageEl.style.display = 'block';
              emailInput.value = '';
            });
        });
      </script>
    </header>

    <div class="paper-edge"></div>

    <!-- Secciones de Contenido (Feed) -->
    <section class="feed">
      <h2 class="author-label">
        Instagram:
        <a href="https://www.instagram.com/laudoblec" target="_blank" rel="noopener noreferrer" class="instagram-link">
          @laudoblec
        </a>
      </h2>

      <!-- Contenedor dinámico de escritos cargados desde Supabase -->
      <div id="posts-container"></div>
    </section>

    <footer class="main-footer">
      <div class="divider"></div>
      <span class="decorator">&#10084;</span>
      <p class="author-credit">Enreve®sada &reg;</p>

      <p class="footer-legal">
        © 2026 Enreve®sada · <a href="https:///" target="_blank" rel="noopener">Privacidad</a> · <a
          href="https://www./" target="_blank" rel="noopener">Aviso legal</a>
      </p>
    </footer>

  </main>

  <!-- Lógica de Supabase y de la web -->
  <script src="script.js"></script>
</body>

</html>
